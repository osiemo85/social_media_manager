{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:3rem auto;">
  <h1>Create your account</h1>
  <p class="muted">Your data (drafts, tokens, consent records) is stored in an
    isolated, encrypted per-user space. You decide which sources to connect —
    or use manual mode with no access at all.</p>
  <form method="post">
    <label>Email</label><input type="email" name="email" required>
    <label>Password (min 8 chars)</label>
    <input type="password" name="password" minlength="8" required>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
