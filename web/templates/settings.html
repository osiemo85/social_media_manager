{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<div class="card">
  <form method="post">
    <label>Publishing mode</label>
    <select name="mode">
      <option value="review" {% if mode == 'review' %}selected{% endif %}>
        Review — every draft waits for my approval (recommended)</option>
      <option value="auto" {% if mode == 'auto' %}selected{% endif %}>
        Auto-publish — post without per-post approval (requires auto-publish consent)</option>
    </select>
    <label>Scheduled runs per day (ingest → draft → route)</label>
    <select name="runs_per_day">
      {% for c in choices %}
      <option value="{{ c }}" {% if c == schedule %}selected{% endif %}>
        {% if c == 0 %}Off — run manually only{% else %}{{ c }}× per day
        (every {{ (24 / c) | round(1) }}h){% endif %}</option>
      {% endfor %}
    </select>
    <p class="muted">In review mode, scheduled runs only fill your review
      queue. In auto mode they may publish, limited by the daily auto-post
      cap and blocklist.</p>
    <button type="submit">Save settings</button>
  </form>
</div>
{% endblock %}
